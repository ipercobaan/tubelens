<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TubeLens — Tool Riset YouTube</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2e38; --txt:#e8eaf0; --dim:#9aa0ae; --acc:#ff4d2e; --gold:#f5b301; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,sans-serif; padding:0 0 60px; }
  header { padding:28px 24px 8px; max-width:1200px; margin:0 auto; }
  header h1 { font-size:26px; letter-spacing:.5px; }
  header h1 span { color:var(--acc); }
  header p { color:var(--dim); font-size:13px; margin-top:6px; }
  .tabs { display:flex; gap:8px; max-width:1200px; margin:18px auto 0; padding:0 24px; }
  .tabs button { background:var(--card); border:1px solid var(--line); color:var(--dim); padding:10px 20px; border-radius:10px; cursor:pointer; font-size:14px; }
  .tabs button.active { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  .filters { display:flex; gap:10px; flex-wrap:wrap; max-width:1200px; margin:16px auto; padding:0 24px; }
  .filters select, .filters input, .filters button { background:var(--card); border:1px solid var(--line); color:var(--txt); padding:10px 14px; border-radius:10px; font-size:14px; }
  .filters button { cursor:pointer; }
  .filters button:hover { border-color:var(--acc); }
  .filters button:disabled { opacity:.5; cursor:wait; }
  .filters input { flex:1; min-width:200px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px; max-width:1200px; margin:0 auto; padding:0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; transition:transform .15s; }
  .card:hover { transform:translateY(-3px); border-color:var(--acc); }
  .thumb { position:relative; aspect-ratio:16/9; background:#000; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .dur { position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,.8); font-size:12px; padding:3px 7px; border-radius:6px; }
  .outlier { position:absolute; top:8px; left:8px; background:var(--gold); color:#111; font-size:12px; font-weight:700; padding:4px 9px; border-radius:8px; }
  .body { padding:14px; }
  .body h3 { font-size:14px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:40px; }
  .body h3 a { color:var(--txt); text-decoration:none; }
  .body h3 a:hover { color:var(--acc); }
  .meta { color:var(--dim); font-size:12.5px; margin-top:8px; line-height:1.6; }
  .meta b { color:var(--txt); }
  .niche-tag { display:inline-block; font-size:11px; background:#262b36; border:1px solid var(--line); padding:3px 9px; border-radius:20px; margin-top:8px; color:var(--dim); }
  .status { max-width:1200px; margin:30px auto; padding:0 24px; color:var(--dim); text-align:center; font-size:14px; }
  .hint { max-width:1200px; margin:0 auto; padding:14px 24px 0; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Tube<span>Lens</span></h1>
  <p>Riset video viral YouTube Indonesia — galeri thumbnail, radar outlier, bedah AI. <em>(codename, MVP)</em></p>
</header>

<div class="tabs">
  <button id="tab-gallery" class="active" onclick="setTab('gallery')">🔥 Galeri Viral</button>
  <button id="tab-outlier" onclick="setTab('outlier')">📡 Radar Outlier</button>
</div>

<div class="filters">
  <select id="f-niche" onchange="load()"><option value="">Semua Niche</option></select>
  <select id="f-sort" onchange="load()">
    <option value="views">Paling banyak views</option>
    <option value="latest">Paling baru</option>
    <option value="outlier">Skor outlier tertinggi</option>
  </select>
  <input id="f-q" placeholder="Cari judul... (Enter)" onkeydown="if(event.key==='Enter')load()">
  <button id="btn-crawl" onclick="runCrawl()" title="Ambil video terbaru + update views sekarang">🔄 Crawl</button>
</div>
<div class="hint" id="crawl-status"></div>
<div class="hint" id="hint"></div>
<div class="grid" id="grid"></div>
<div class="status" id="status">Memuat...</div>

<script>
let tab = 'gallery';
function fmt(n){ if(n==null) return '-'; if(n>=1e6) return (n/1e6).toFixed(1).replace('.',',')+' jt'; if(n>=1e3) return (n/1e3).toFixed(1).replace('.',',')+' rb'; return n; }
function ago(iso){ try{ const d=(Date.now()-new Date(iso))/864e5; if(d<1) return 'hari ini'; if(d<30) return Math.floor(d)+' hari lalu'; if(d<365) return Math.floor(d/30)+' bln lalu'; return Math.floor(d/365)+' thn lalu'; }catch(e){ return ''; } }
function dur(s){ if(!s) return ''; s=Math.floor(s); const m=Math.floor(s/60), h=Math.floor(m/60); return h? h+':'+String(m%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0') : m+':'+String(s%60).padStart(2,'0'); }

async function loadNiches(){
  const r = await fetch('/api/niches'); const data = await r.json();
  const sel = document.getElementById('f-niche');
  data.forEach(n => { const o=document.createElement('option'); o.value=n.slug; o.textContent=`${n.name} (${n.videos} video)`; sel.appendChild(o); });
}
function setTab(t){ tab=t;
  document.getElementById('tab-gallery').classList.toggle('active', t==='gallery');
  document.getElementById('tab-outlier').classList.toggle('active', t==='outlier');
  document.getElementById('f-sort').style.display = t==='outlier' ? 'none' : '';
  document.getElementById('hint').textContent = t==='outlier'
    ? 'Radar Outlier: video yang views-nya jauh di atas rata-rata channel-nya sendiri. Skor 5x = video itu 5x lebih viral dari biasanya.'
    : 'Galeri Viral: thumbnail & judul dengan views tertinggi per niche. Klik judul untuk buka videonya.';
  load();
}
async function load(){
  const grid=document.getElementById('grid'), status=document.getElementById('status');
  grid.innerHTML=''; status.textContent='Memuat...';
  const niche=document.getElementById('f-niche').value, q=document.getElementById('f-q').value.trim();
  const sort=document.getElementById('f-sort').value;
  const url = tab==='gallery'
    ? `/api/videos?niche=${niche}&sort=${sort}&q=${encodeURIComponent(q)}`
    : `/api/outliers?niche=${niche}&min_score=2`;
  const r = await fetch(url); const data = await r.json();
  status.textContent = data.length ? `${data.length} video ditemukan` : 'Belum ada data. Jalankan crawler dulu.';
  data.forEach(v=>{
    const el=document.createElement('div'); el.className='card';
    el.innerHTML=`
      <div class="thumb">
        <img loading="lazy" src="${v.thumbnail_url||''}" alt="" onerror="this.style.display='none'">
        ${v.outlier_score>=3?`<span class="outlier">🔥 ${v.outlier_score}x outlier</span>`:''}
        ${v.duration_seconds?`<span class="dur">${dur(v.duration_seconds)}</span>`:''}
      </div>
      <div class="body">
        <h3><a href="https://www.youtube.com/watch?v=${v.video_id}" target="_blank">${escapeHtml(v.title||'(tanpa judul)')}</a></h3>
        <div class="meta">${escapeHtml(v.channel_title||'')}<br><b>${fmt(v.views)}</b> views • ${fmt(v.likes)} likes • ${ago(v.published_at)}</div>
        <span class="niche-tag">${escapeHtml(v.niche_name||'')}</span>
      </div>`;
    grid.appendChild(el);
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function runCrawl(){
  const btn=document.getElementById('btn-crawl'), el=document.getElementById('crawl-status');
  btn.disabled=true; el.textContent='Memulai crawl...';
  const r=await fetch('/api/crawl',{method:'POST'}); const d=await r.json();
  el.textContent=d.message;
  pollCrawl();
}
async function pollCrawl(){
  const btn=document.getElementById('btn-crawl'), el=document.getElementById('crawl-status');
  const r=await fetch('/api/crawl/status'); const s=await r.json();
  if(s.status==='running'){ el.textContent='🔄 Crawl berjalan... ('+(s.started_at||'').slice(11,19)+')'; setTimeout(pollCrawl, 8000); }
  else { btn.disabled=false; el.textContent=(s.status==='done'?'✅ ':'⚠️ ')+(s.message||s.status); if(s.status==='done') load(); }
}
loadNiches().then(()=>setTab('gallery'));
</script>
</body>
</html>
